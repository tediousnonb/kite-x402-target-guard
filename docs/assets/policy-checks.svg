<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Target Guard policy checks</title>
  <desc id="desc">Four layers cover transport, destination, payment and evidence checks.</desc>
  <rect width="1280" height="420" rx="24" fill="#080b0a"/>
  <text x="64" y="65" fill="#89f3b0" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="3">DEFENSE IN DEPTH</text>
  <text x="64" y="108" fill="#edf5f1" font-family="Arial,sans-serif" font-size="28" font-weight="700">One decision, four independent layers</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(64 156)"><rect width="268" height="190" rx="12" fill="#101513" stroke="#28352f"/><text x="24" y="38" fill="#89f3b0" font-family="monospace" font-size="13">01 / TRANSPORT</text><text x="24" y="79" fill="#edf5f1" font-size="20" font-weight="700">HTTPS boundary</text><text x="24" y="112" fill="#8e9a94" font-size="14">Credentials and unusual ports</text><text x="24" y="138" fill="#8e9a94" font-size="14">are rejected before resolution.</text><path d="M24 164h220" stroke="#34473e"/><circle cx="236" cy="164" r="4" fill="#d8ff73"/></g>
    <g transform="translate(356 156)"><rect width="268" height="190" rx="12" fill="#101513" stroke="#28352f"/><text x="24" y="38" fill="#89f3b0" font-family="monospace" font-size="13">02 / DESTINATION</text><text x="24" y="79" fill="#edf5f1" font-size="20" font-weight="700">DNS + SSRF</text><text x="24" y="112" fill="#8e9a94" font-size="14">Every A and AAAA answer must</text><text x="24" y="138" fill="#8e9a94" font-size="14">resolve to a public address.</text><path d="M24 164h220" stroke="#34473e"/><circle cx="236" cy="164" r="4" fill="#d8ff73"/></g>
    <g transform="translate(648 156)"><rect width="268" height="190" rx="12" fill="#101513" stroke="#28352f"/><text x="24" y="38" fill="#89f3b0" font-family="monospace" font-size="13">03 / PAYMENT</text><text x="24" y="79" fill="#edf5f1" font-size="20" font-weight="700">Kite policy</text><text x="24" y="112" fill="#8e9a94" font-size="14">Network, PIEUSD, amount, payee</text><text x="24" y="138" fill="#8e9a94" font-size="14">and timeout are verified.</text><path d="M24 164h220" stroke="#34473e"/><circle cx="236" cy="164" r="4" fill="#d8ff73"/></g>
    <g transform="translate(940 156)"><rect width="276" height="190" rx="12" fill="#101513" stroke="#28352f"/><text x="24" y="38" fill="#89f3b0" font-family="monospace" font-size="13">04 / EVIDENCE</text><text x="24" y="79" fill="#edf5f1" font-size="20" font-weight="700">Audit trail</text><text x="24" y="112" fill="#8e9a94" font-size="14">Decision metadata is retained</text><text x="24" y="138" fill="#8e9a94" font-size="14">without secrets or full URLs.</text><path d="M24 164h228" stroke="#34473e"/><circle cx="244" cy="164" r="4" fill="#d8ff73"/></g>
  </g>
</svg>
