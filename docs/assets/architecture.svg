<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Kite x402 Target Guard architecture</title>
  <desc id="desc">An agent sends a URL and x402 challenge through parsing, DNS safety and payment policy checks before receiving a decision and audit record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080b0a"/><stop offset="1" stop-color="#10251d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#89f3b0"/></marker>
  </defs>
  <rect width="1280" height="540" rx="24" fill="url(#bg)"/>
  <text x="64" y="68" fill="#89f3b0" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="3">PAYMENT PREFLIGHT ARCHITECTURE</text>
  <text x="64" y="112" fill="#edf5f1" font-family="Arial,sans-serif" font-size="28" font-weight="700">Deterministic checks before autonomous payment</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(64 190)">
      <rect width="190" height="180" rx="12" fill="#101513" stroke="#34473e"/>
      <circle cx="95" cy="54" r="22" fill="none" stroke="#89f3b0" stroke-width="2"/><path d="M84 55l8 8 16-19" fill="none" stroke="#d8ff73" stroke-width="3"/>
      <text x="95" y="104" fill="#edf5f1" font-size="18" font-weight="700" text-anchor="middle">Agent client</text>
      <text x="95" y="132" fill="#8e9a94" font-size="13" text-anchor="middle">URL + x402 challenge</text>
      <text x="95" y="154" fill="#8e9a94" font-size="13" text-anchor="middle">v1 or v2</text>
    </g>
    <path d="M264 280h76" stroke="#89f3b0" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(352 162)">
      <rect width="576" height="236" rx="14" fill="#101513" stroke="#89f3b0" stroke-width="2" filter="url(#glow)"/>
      <text x="30" y="42" fill="#d8ff73" font-size="20" font-weight="700">Kite x402 Target Guard</text>
      <g fill="#0a0e0c" stroke="#34473e">
        <rect x="30" y="68" width="156" height="64" rx="8"/><rect x="210" y="68" width="156" height="64" rx="8"/><rect x="390" y="68" width="156" height="64" rx="8"/>
      </g>
      <g fill="#edf5f1" font-size="14" font-weight="700" text-anchor="middle">
        <text x="108" y="96">Normalize</text><text x="108" y="116" fill="#8e9a94" font-size="12" font-weight="400">challenge fields</text>
        <text x="288" y="96">Resolve DNS</text><text x="288" y="116" fill="#8e9a94" font-size="12" font-weight="400">block private IPs</text>
        <text x="468" y="96">Enforce policy</text><text x="468" y="116" fill="#8e9a94" font-size="12" font-weight="400">asset · amount · payee</text>
      </g>
      <path d="M108 148h360" stroke="#34473e" stroke-width="2"/>
      <circle cx="108" cy="148" r="5" fill="#89f3b0"/><circle cx="288" cy="148" r="5" fill="#89f3b0"/><circle cx="468" cy="148" r="5" fill="#89f3b0"/>
      <text x="30" y="194" fill="#8e9a94" font-size="13">Optional paid mode</text>
      <text x="30" y="216" fill="#edf5f1" font-size="14" font-weight="700">Facilitator verify → settle → receipt</text>
    </g>
    <path d="M940 280h76" stroke="#89f3b0" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1028 190)">
      <rect width="188" height="180" rx="12" fill="#101513" stroke="#34473e"/>
      <text x="94" y="56" fill="#d8ff73" font-size="34" font-weight="700" text-anchor="middle">0–100</text>
      <text x="94" y="88" fill="#edf5f1" font-size="18" font-weight="700" text-anchor="middle">Risk decision</text>
      <text x="94" y="120" fill="#89f3b0" font-size="13" text-anchor="middle">ALLOW / BLOCK</text>
      <text x="94" y="148" fill="#8e9a94" font-size="12" text-anchor="middle">privacy-safe audit</text>
    </g>
  </g>
  <text x="64" y="476" fill="#8e9a94" font-family="ui-monospace,monospace" font-size="13">HTTPS • DNS SSRF • RESOURCE BINDING • KITE NETWORK • PIEUSD • LIMITS • PAYEE • TIMEOUT</text>
</svg>
